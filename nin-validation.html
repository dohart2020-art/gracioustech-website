<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f3d">
  <title>NIN Validation - Gracioustec</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
    }

    .header {
      background: #087f3d;
      color: white;
      text-align: center;
      padding: 22px;
      border-radius: 14px;
    }

    .header h1 { margin: 0 0 8px; }
    .header p { margin: 0; }

    .card {
      background: white;
      padding: 22px;
      margin-top: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0000000d;
    }

    .balance {
      background: #e8f5ec;
      color: #087f3d;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #087f3d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary { background: #37474f; }

    .hidden { display: none !important; }

    .option {
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      cursor: pointer;
    }

    .option:has(input:checked) {
      border: 2px solid #087f3d;
      background: #f0faf3;
    }

    .option-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option input {
      width: 19px;
      height: 19px;
      accent-color: #087f3d;
    }

    .option-name { flex: 1; }
    .option-price {
      font-size: 17px;
      font-weight: bold;
      color: #087f3d;
      white-space: nowrap;
    }

    .description {
      font-size: 13px;
      color: #666;
      margin: 8px 0 0 29px;
      line-height: 1.5;
      font-weight: normal;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      white-space: pre-line;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .note {
      font-size: 13px;
      line-height: 1.6;
      color: #666;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px 0;
      text-decoration: none;
      color: #087f3d;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>GRACIOUSTEC</h1>
      <p>NIN Validation</p>
    </header>

    <section class="card">
      <div class="balance">
        Wallet Balance: <span id="walletBalance">Loading...</span>
      </div>

      <form id="validationForm">
        <label for="nin">Enter your 11-digit NIN</label>
        <input
          id="nin"
          type="text"
          inputmode="numeric"
          maxlength="11"
          placeholder="Enter NIN"
          required
        >

        <button type="button" id="showOptionsBtn">
          Submit
        </button>

        <div id="optionsSection" class="hidden">
          <label>Select the service you want</label>

          <label class="option">
            <div class="option-line">
              <input
                type="radio"
                name="validationType"
                value="no_record"
                checked
              >
              <span class="option-name">No Record Found</span>
              <span class="option-price">₦1,200</span>
            </div>
            <p class="description">
              Price for the No Record validation option.
            </p>
          </label>

          <label class="option">
            <div class="option-line">
              <input
                type="radio"
                name="validationType"
                value="update_record"
              >
              <span class="option-name">Update Details</span>
              <span class="option-price">₦1,500</span>
            </div>
            <p class="description">
              Price for the Update Record validation option.
            </p>
          </label>

          <button type="submit" id="payBtn">
            Continue to Payment
          </button>
        </div>
      </form>

      <button type="button" id="statusBtn" class="secondary">
        Check Validation Status
      </button>

      <div id="message" class="message" role="status"></div>

      <p class="note">
        Confirm your NIN and service selection before payment.
        Payment is deducted from your wallet. If a request is still
        processing, check its status before submitting another request.
      </p>
    </section>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>
  </main>

  <script>
    const SUPABASE_URL =
      "https://iknhifndgpwibkfidggq.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_xELauxOMm7eMkNrPz55Mrw_LVkRoASn";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const PRICES = {
      no_record: 1200,
      update_record: 1500
    };

    const form = document.getElementById("validationForm");
    const ninInput = document.getElementById("nin");
    const optionsSection = document.getElementById("optionsSection");
    const showOptionsBtn = document.getElementById("showOptionsBtn");
    const payBtn = document.getElementById("payBtn");
    const statusBtn = document.getElementById("statusBtn");
    const walletBalance = document.getElementById("walletBalance");
    const message = document.getElementById("message");

    let balance = 0;

    function formatMoney(amount) {
      return "₦" + Number(amount).toLocaleString("en-NG");
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function getSelectedType() {
      return document.querySelector(
        'input[name="validationType"]:checked'
      ).value;
    }

    async function getSession() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        window.location.href = "login.html";
        return null;
      }

      return data.session;
    }

    async function loadWallet() {
      const session = await getSession();
      if (!session) return;

      const { data, error } = await client
        .from("wallets")
        .select("balance")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error || !data) {
        walletBalance.textContent = "Unavailable";
        return;
      }

      balance = Number(data.balance || 0);
      walletBalance.textContent = formatMoney(balance);
    }

    ninInput.addEventListener("input", () => {
      ninInput.value = ninInput.value.replace(/\D/g, "").slice(0, 11);
    });

    showOptionsBtn.addEventListener("click", async () => {
      clearMessage();

      const session = await getSession();
      if (!session) return;

      if (!/^\d{11}$/.test(ninInput.value.trim())) {
        showMessage("Please enter a valid 11-digit NIN first.", "error");
        return;
      }

      optionsSection.classList.remove("hidden");
      showOptionsBtn.textContent = "Change NIN";
      optionsSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const session = await getSession();
      if (!session) return;

      const nin = ninInput.value.trim();
      const validationType = getSelectedType();
      const amount = PRICES[validationType];

      if (!/^\d{11}$/.test(nin)) {
        showMessage("Please enter a valid 11-digit NIN.", "error");
        return;
      }

      if (balance < amount) {
        showMessage(
          "Insufficient wallet balance. You need " +
          formatMoney(amount) + ".",
          "error"
        );
        return;
      }

      const confirmed = window.confirm(
        "Service: " +
        (validationType === "no_record"
          ? "No Record Found"
          : "Update Details") +
        "\nAmount: " + formatMoney(amount) +
        "\n\nProceed with payment?"
      );

      if (!confirmed) return;

      payBtn.disabled = true;
      statusBtn.disabled = true;
      payBtn.textContent = "Processing...";

      try {
        const { data, error } = await client.functions.invoke(
          "nin-validation",
          {
            body: {
              action: "submit",
              nin,
              validation_type: validationType
            }
          }
        );

        if (error) {
          throw new Error(error.message || "Request failed.");
        }

        if (!data || data.success !== true) {
          showMessage(
            (data?.message || "Validation request failed.") +
            (data?.payment_reference
              ? "\nReference: " + data.payment_reference
              : ""),
            "error"
          );
          await loadWallet();
          return;
        }

        showMessage(
          (data.message || "Request submitted successfully.") +
          "\nAmount charged: " +
          formatMoney(data.amount_charged ?? amount) +
          "\nStatus: " + (data.status || "Processing") +
          (data.payment_reference
            ? "\nReference: " + data.payment_reference
            : ""),
          "success"
        );

        await loadWallet();
      } catch (error) {
        showMessage(
          error.message ||
          "Request failed. Check the status before trying again.",
          "error"
        );
        await loadWallet();
      } finally {
        payBtn.disabled = false;
        statusBtn.disabled = false;
        payBtn.textContent = "Continue to Payment";
      }
    });

    statusBtn.addEventListener("click", async () => {
      clearMessage();

      const session = await getSession();
      if (!session) return;

      const nin = ninInput.value.trim();

      if (!/^\d{11}$/.test(nin)) {
        showMessage(
          "Enter the 11-digit NIN used for your request.",
          "error"
        );
        return;
      }

      statusBtn.disabled = true;
      statusBtn.textContent = "Checking...";

      try {
        const { data, error } = await client.functions.invoke(
          "nin-validation",
          {
            body: {
              action: "status",
              nin
            }
          }
        );

        if (error) {
          throw new Error(error.message || "Status check failed.");
        }

        if (!data || data.success !== true) {
          showMessage(
            data?.message || "Unable to retrieve status.",
            "error"
          );
          return;
        }

        const request = data.request || {};

        showMessage(
          (data.message || "Status retrieved.") +
          "\nRequest status: " +
          (request.request_status || "Unknown") +
          "\nValidation status: " +
          (request.validation_status || "Unknown") +
          "\nAmount: " + formatMoney(request.amount || 0),
          "success"
        );

        await loadWallet();
      } catch (error) {
        showMessage(error.message || "Status check failed.", "error");
      } finally {
        statusBtn.disabled = false;
        statusBtn.textContent = "Check Validation Status";
      }
    });

    loadWallet();
  </script>
</body>
</html>
