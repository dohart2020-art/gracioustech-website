  </style></head><body><header>

  </button>
</header><div class="container">  <div class="profile-card"><div id="loading" class="loading">
  Loading profile...
</div>

<div id="profileContent" style="display:none;">

  <div class="profile-icon" id="profileIcon">
    U
  </div>

  <h3>Gracioustec Account Information</h3>

  <div class="info-box">
    <label>Name</label>
    <div class="info" id="userName">-</div>
  </div>

  <div class="info-box">
    <label>Email Address</label>
    <div class="info" id="userEmail">-</div>
  </div>

  <div class="info-box">
    <label>User ID</label>
    <div class="info" id="userId">-</div>
  </div>

  <div class="info-box">
    <label>Account Created</label>
    <div class="info" id="createdAt">-</div>
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>

  </div></div><script>

const SUPABASE_URL =
  "https://iknhifndgpwibkfidggq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xELauxOMm7eMkNrPz55Mrw_LVkRoASn";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// Load logged-in user
async function loadProfile() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "login.html";
    return;
  }

  const metadata = user.user_metadata || {};

  const name =
    metadata.full_name ||
    metadata.name ||
    metadata.display_name ||
    "Gracioustec User";

  document.getElementById("userName").textContent =
    name;

  document.getElementById("userEmail").textContent =
    user.email || "Not available";

  document.getElementById("userId").textContent =
    user.id;

  if (user.created_at) {

    const date =
      new Date(user.created_at);

    document.getElementById("createdAt").textContent =
      date.toLocaleString();

  }

  // First letter of name
  document.getElementById("profileIcon").textContent =
    name.charAt(0).toUpperCase();

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("profileContent").style.display =
    "block";
}


// Logout
async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


loadProfile();

</script></body>
</html>
