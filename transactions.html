  /* ==========================================
     SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "https://iknhifndgpwibkfidggq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_xELauxOMm7eMkNrPz55Mrw_LVkRoASn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     FORMAT NAIRA
     ========================================== */

  function formatNaira(amount) {

    return "₦" +
      Number(amount || 0).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }


  /* ==========================================
     FORMAT DATE
     ========================================== */

  function formatDate(date) {

    if (!date) {
      return "—";
    }

    return new Date(date).toLocaleString(
      "en-NG",
      {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  /* ==========================================
     ESCAPE HTML
     ========================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     BACK TO DASHBOARD
     ========================================== */

  function goBack() {

    window.location.href =
      "dashboard.html";

  }


  /* ==========================================
     LOAD TRANSACTIONS
     ========================================== */

  async function loadTransactions() {

    const loading =
      document.getElementById("loading");

    const empty =
      document.getElementById("empty");

    const table =
      document.getElementById("transactionTable");

    const body =
      document.getElementById("transactionBody");

    const errorBox =
      document.getElementById("errorBox");


    loading.style.display = "block";

    empty.style.display = "none";

    table.style.display = "none";

    errorBox.style.display = "none";

    body.innerHTML = "";


    try {

      /* GET CURRENT USER */

      const {
        data: {
          session
        },
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (sessionError) {
        throw sessionError;
      }


      if (!session) {

        window.location.href =
          "login.html";

        return;

      }


      const user =
        session.user;


      /* ======================================
         GET WALLET TRANSACTIONS
         ====================================== */

      const {
        data: transactions,
        error
      } =
        await supabaseClient
          .from("wallet_transactions")
          .select(
            "id, user_id, type, amount, description, reference, created_at"
          )
          .eq(
            "user_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Wallet transaction error:",
          error
        );

        throw error;

      }


      loading.style.display = "none";


      /* NO TRANSACTIONS */

      if (
        !transactions ||
        transactions.length === 0
      ) {

        empty.style.display = "block";

        document.getElementById(
          "totalTransactions"
        ).textContent = "0";

        document.getElementById(
          "totalCredits"
        ).textContent = "₦0.00";

        return;

      }


      /* SHOW TABLE */

      table.style.display = "table";


      document.getElementById(
        "totalTransactions"
      ).textContent =
        transactions.length;


      let totalCredits = 0;


      /* ======================================
         BUILD TRANSACTION ROWS
         ====================================== */

      transactions.forEach(
        transaction => {

          const type =
            transaction.type || "Transaction";


          const description =
            transaction.description ||
            "Wallet transaction";


          const reference =
            transaction.reference ||
            "—";


          const amount =
            Number(
              transaction.amount || 0
            );


          const lowerType =
            String(type).toLowerCase();


          /*
           * CREDIT TYPES
           *
           * Reckopay wallet funding should
           * normally appear as a credit.
           */

          const isCredit =
            lowerType.includes("credit") ||
            lowerType.includes("fund") ||
            lowerType.includes("deposit") ||
            lowerType.includes("wallet");


          if (isCredit) {

            totalCredits += amount;

          }


          const amountClass =
            isCredit
              ? "credit"
              : "debit";


          const sign =
            isCredit
              ? "+"
              : "-";


          const row =
            document.createElement("tr");


          row.innerHTML = `

            <td>
              ${formatDate(
                transaction.created_at
              )}
            </td>

            <td class="type">
              ${escapeHtml(type)}
            </td>

            <td>
              ${escapeHtml(description)}
            </td>

            <td class="${amountClass}">
              ${sign}${formatNaira(amount)}
            </td>

            <td>
              ${escapeHtml(reference)}
            </td>

          `;


          body.appendChild(row);

        }
      );


      document.getElementById(
        "totalCredits"
      ).textContent =
        formatNaira(totalCredits);

    }

    catch (error) {

      console.error(
        "Transaction history error:",
        error
      );

      loading.style.display = "none";

      errorBox.textContent =
        "Unable to load your transaction history. Please try again.";

      errorBox.style.display = "block";

    }

  }


  /* ==========================================
     START
     ========================================== */

  loadTransactions();

</script></body>
