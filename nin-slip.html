<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIN Slip Download - Gracioustec</title>
  <meta name="theme-color" content="#087f3d">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 45px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      color: #087f3d;
      margin-top: 0;
    }

    .info {
      background: #f1f8f3;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .info p {
      margin: 8px 0;
      font-size: 14px;
    }

    button, .back-link {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: #087f3d;
      color: white;
    }

    .open-button {
      background: #e7f2ea;
      color: #087f3d;
    }

    .back-link {
      background: #eeeeee;
      color: #333;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      background: #fff0f0;
      color: #a00000;
      margin-top: 15px;
    }

    .small {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      margin-top: 20px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>GRACIOUSTEC</h2>
    <h3>NIN Slip Download</h3>

    <p>Your PDF is ready.</p>

    <div id="details" class="info" hidden>
      <p><strong>Slip type:</strong> <span id="slipType"></span></p>
      <p><strong>File:</strong> <span id="fileName"></span></p>
      <p id="trackingRow" hidden>
        <strong>Tracking ID:</strong>
        <span id="trackingId"></span>
      </p>
    </div>

    <div id="errorMessage" class="message" hidden></div>

    <div id="downloadSection" hidden>
      <button type="button" id="downloadButton">
        Download NIN Slip PDF
      </button>

      <button type="button" id="openButton" class="open-button">
        Open PDF
      </button>
    </div>

    <a href="nin.html" class="back-link">
      Back to NIN Reprint
    </a>

    <p class="small">
      This page provides the original PDF returned by the service
      provider. Gracioustec does not recreate or alter the document.
    </p>
  </div>

  <script>
    let pdfUrl = null;
    let savedFileName = "Gracioustec-NIN-Slip.pdf";

    function showError(message) {
      document.getElementById("errorMessage").textContent = message;
      document.getElementById("errorMessage").hidden = false;
      document.getElementById("downloadSection").hidden = true;
      document.getElementById("details").hidden = true;
    }

    function loadPDF() {
      const paid = sessionStorage.getItem("gracioustech_nin_paid");

      if (paid !== "true") {
        showError("Payment is required before you can download this PDF.");
        return;
      }

      let base64 = sessionStorage.getItem("gracioustech_nin_pdf");

      if (!base64) {
        showError("The PDF could not be found. Please return to the NIN Reprint page and verify again.");
        return;
      }

      const mimeType =
        sessionStorage.getItem("gracioustech_nin_pdf_mime") ||
        "application/pdf";

      savedFileName =
        sessionStorage.getItem("gracioustech_nin_pdf_name") ||
        "Gracioustec-NIN-Slip.pdf";

      const slipType =
        sessionStorage.getItem("gracioustech_slip_type") ||
        "NIN Slip";

      const trackingId =
        sessionStorage.getItem("gracioustech_nin_tracking") || "";

      try {
        // Remove a possible data URI prefix.
        base64 = base64.replace(/^data:[^,]*;base64,/i, "");
        base64 = base64.replace(/\s/g, "");

        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob([bytes], { type: mimeType });

        if (pdfUrl) {
          URL.revokeObjectURL(pdfUrl);
        }

        pdfUrl = URL.createObjectURL(blob);

        // Ensure a safe PDF filename.
        savedFileName = savedFileName
          .replace(/[\\/:*?"<>|]/g, "_");

        if (!savedFileName.toLowerCase().endsWith(".pdf")) {
          savedFileName += ".pdf";
        }

        document.getElementById("slipType").textContent = slipType;
        document.getElementById("fileName").textContent = savedFileName;

        if (trackingId) {
          document.getElementById("trackingId").textContent = trackingId;
          document.getElementById("trackingRow").hidden = false;
        }

        document.getElementById("details").hidden = false;
        document.getElementById("downloadSection").hidden = false;

      } catch (error) {
        showError("The PDF could not be opened. Please return to the NIN Reprint page and try again.");
      }
    }

    document.getElementById("downloadButton").addEventListener("click", function() {
      if (!pdfUrl) {
        showError("PDF is not available. Please reload this page.");
        return;
      }

      const link = document.createElement("a");
      link.href = pdfUrl;
      link.download = savedFileName;

      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    document.getElementById("openButton").addEventListener("click", function() {
      if (pdfUrl) {
        window.open(pdfUrl, "_blank");
      }
    });

    window.addEventListener("beforeunload", function() {
      if (pdfUrl) {
        URL.revokeObjectURL(pdfUrl);
      }
    });

    loadPDF();
  </script>

</body>
</html>
